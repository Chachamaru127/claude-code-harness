name: validate-plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded PR runs but never cancel a main-branch run mid-flight,
# because main runs feed into release readiness checks downstream.
concurrency:
  group: validate-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: actionlint
    runs-on: instabox-medium
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Setup Go (harness composite)
        uses: ./.github/actions/setup-go-harness

      - name: Install actionlint via go install (version-pinned, immutable)
        # Using `go install MODULE@VERSION` resolves to a content-addressed
        # module proxy entry, providing the same supply-chain guarantees as
        # SHA-pinned actions without depending on a mutable Docker tag.
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint (workflow YAML lint)
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

  validate:
    # Paid Instabox workspace: 8 vCPU / 16 GB.
    runs-on: instabox-large
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-version-bump.sh needs `origin/$GITHUB_BASE_REF`, so we still
          # fetch full history but skip blobs for a faster checkout.
          fetch-depth: 0
          filter: blob:none

      - name: Check release metadata policy
        run: |
          bash ./scripts/ci/check-version-bump.sh

      - name: Install command-line dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck

      - name: Setup Node.js for CLI smoke
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install Codex CLI for adapter smoke
        run: npm install -g @openai/codex@0.133.0

      - name: Setup Go (harness composite)
        uses: ./.github/actions/setup-go-harness

      - name: Run ShellCheck high-risk subset
        run: bash ./tests/test-shell-lint.sh

      - name: Check i18n regression suite
        run: |
          bash ./scripts/i18n/check-translations.sh
          bash ./tests/test-i18n-default-language.sh
          bash ./tests/test-i18n-skill-frontmatter.sh
          bash ./tests/test-i18n-locale-roundtrip.sh
          bash ./tests/test-setup-language-rendering.sh

      - name: Validate plugin structure
        run: |
          bash ./tests/validate-plugin.sh

      - name: Check Go test shard assignment
        run: |
          bash ./tests/test-go-test-shard.sh

      - name: Audit breezing benchmark dependencies
        run: |
          bash ./tests/test-breezing-agent-eval-deps.sh

      - name: Check consistency (templates/refs/version/hooks)
        run: |
          bash ./scripts/ci/check-consistency.sh

      - name: Validate codex package (multi-agent migration guards)
        run: |
          bash ./tests/test-codex-package.sh

      - name: Run Codex plugin adapter smoke
        env:
          HARNESS_CODEX_PLUGIN_SMOKE_REQUIRED: "1"
        run: |
          bash ./tests/test-codex-plugin-adapter.sh

      - name: Host registry + structural workflow smoke
        run: |
          bash ./tests/test-host-registry.sh
          bash ./tests/test-host-smoke-lib.sh
          bash ./tests/test-support-claim-wording.sh
          for h in claude codex cursor grok; do
            bash ./tests/test-host-workflow-smoke.sh --host "$h"
          done
        # Live model invocations remain opt-in (see docs/research/host-workflow-smoke-policy.md).
        # REQUIRED=1 is reserved for nightly/release when CLI secrets/images are stable.

  # The full suite covers every package. One job could not run it: on
  # 2026-11-09 a paid instabox-large box lost communication with the runner
  # roughly 11 minutes in, and GitHub-hosted runners ran out of memory. Both
  # failed before the suite finished, so the cause is still unknown. Splitting
  # the same package list keeps the full scope and shortens each job; the
  # assignment and the aggregate check read the same `go list ./...` output.
  go-test-full:
    name: go-test-full (${{ matrix.shard }}/2)
    runs-on: instabox-large
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Setup Go (harness composite)
        uses: ./.github/actions/setup-go-harness

      - name: Run this shard of the full Go suite
        run: bash ./tests/go-test-shard.sh run "${{ matrix.shard }}" 2

      # Logs are uploaded from the machine that ran the tests. When a shard
      # fails or the box disappears, the artifact still shows how far it got.
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/go-test-shard/shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7

  test-go:
    # Required check name kept from the previous workflow. It succeeds only
    # when every shard succeeded and the shard package lists cover every
    # package exactly once.
    name: test-go
    needs: [go-test-full]
    if: always()
    runs-on: instabox-medium
    timeout-minutes: 15

    steps:
      - name: Fail when a shard did not succeed
        if: needs.go-test-full.result != 'success'
        run: |
          echo "go-test-full result: ${{ needs.go-test-full.result }}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none

      - name: Setup Go (harness composite)
        uses: ./.github/actions/setup-go-harness

      - name: Run Go format check
        run: bash ./tests/test-format-lint.sh

      - name: Build harness binary
        working-directory: go
        run: go build ./cmd/harness/

      - name: Run go vet
        working-directory: go
        run: go vet ./...

      - name: Download shard package lists
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: go-shard-*
          path: ${{ runner.temp }}/go-shards

      - name: Verify every package ran in one shard
        run: bash ./tests/go-test-shard.sh verify "${RUNNER_TEMP}/go-shards" 2
