# deleted-concepts.yaml
#
# Purpose:
#   A catalog of "deleted paths and concepts" for systematically detecting
#   Harness migration residue.
#
#   Added in Phase 40. Background: in the two days immediately after the
#   v4.0.0 "Hokage" release, 13 v3 residue bugs were discovered by accident.
#   All were blind spots of inclusion-based verification
#   (not checking "is deleted X still present?").
#   This file serves as the SSOT for exclusion-based verification.
#
# Update Rules:
#   1. When a new deleted path/concept arises, update this file at the time of deletion
#   2. allowlist is applied as prefix match (historical documents are explicitly excluded)
#   3. The reason field is required. Describe "why it was deleted"
#   4. Run scans with scripts/check-residue.sh
#   5. Update deleted_in when the version changes
#
# Allowlist Design Principles:
#   - CHANGELOG.md: always on allowlist for all entries (historical record)
#   - .claude/memory/archive/: always on allowlist for all entries (archive)
#   - .claude/worktrees/: always on allowlist for all entries (past worktree residue)
#   - .claude/state/: always on allowlist for all entries (session state snapshots)
#   - out/, output/: always on allowlist for all entries (generated artifacts, diagnostic output)
#   - docs/social/: always on allowlist for all entries (v3-era social media posts, historical record)
#   - Historical documents should be added individually per entry
#

version: 1

# --- Deleted file paths -----------------------------------------------------------
deleted_paths:
  - path: "core/src/guardrails"
    deleted_in: "v4.0.0"
    reason: "TypeScript guardrail engine ported to Go-native (Hokage migration). Entire core/ including the TS engine was retired."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - "go/"  # Go version file paths contain guardrails — exclude
      - "Plans.md"
      - "out/"
      - "output/"
      - "docs/social/"  # v3-era social media posts (historical record)
      - "skills/claude-codex-upstream-update/"  # upstream update guide (contains historical references)
      - "codex/.codex/skills/claude-codex-upstream-update/"  # Codex mirror
      - ".claude/rules/migration-policy.md"  # Phase 40 historical description (appendix contains deleted paths)

  - path: "core/dist"
    deleted_in: "v4.0.0"
    reason: "TypeScript build artifacts. No longer needed after migration to Go."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - "Plans.md"
      - "out/"
      - "output/"
      - "docs/social/"


# --- Deleted concepts and terms ---------------------------------------------------
deleted_concepts:
  - term: "TypeScript guardrail engine"
    term_ja: "TypeScript guardrail engine (Japanese)"
    replacement: "Go-native guardrail engine"
    replacement_ja: "Go-native guardrail engine (Japanese)"
    deleted_in: "v4.0.0"
    reason: "TS->Go port completed in Hokage migration. Any reference to the TS engine is from the old version."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - "docs/CLAUDE_CODE_COMPATIBILITY.md"  # comparison document
      - "docs/github-harness-plugin-benchmark.md"
      - "docs/MIGRATION-v4.md"  # v3->v4 migration guide (TS engine mention is legitimate)
      - "docs/social/"  # v3-era social media posts
      - "docs/claims-audit.md"  # legacy marketing audit document
      - "docs/distribution-scope.md"  # distribution scope analysis (based on old version)
      - "docs/private/"  # private analysis documents
      - "docs/positioning-notes.md"  # legacy positioning document
      - "docs/release-copy-phase21.md"  # Phase 21 release copy
      - ".claude/rules/"  # rules files (versioning.md contains historical references)
      - "archive/"  # non-Claude runtime historical archive (not active after archiving)
      - "Plans.md"
      - "out/"
      - "output/"

  - term: "Harness v3"
    term_ja: null
    replacement: "Harness v4"
    replacement_ja: "Harness v4"
    deleted_in: "v4.0.0"
    reason: "Old version designation. v4 Hokage is the current version."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - ".claude/rules/v3-architecture.md"  # historical document for v3 architecture
      - "docs/CLAUDE-feature-table.md"  # historical table (includes old version comparisons)
      - "docs/MIGRATION-v4.md"  # v3->v4 migration guide
      - "docs/distribution-scope.md"  # distribution scope document
      - "docs/social/"  # v3-era social media posts (historical record)
      - "scripts/setup-codex.sh"  # uses Harness v3 as a grep detection pattern (intentional)
      - "scripts/codex-setup-local.sh"  # same as above
      - "tests/test-codex-package.sh"  # v3 legacy skill test (comment)
      - "skills-codex/"  # codex skill mirror (independently managed)
      - ".claude/rules/migration-policy.md"  # Phase 40 historical description (appendix contains old version names)
      - "archive/"  # non-Claude runtime historical archive
      - "out/"
      - "output/"
      - "Plans.md"

  - term: "# "
    term_ja: null
    replacement: null
    replacement_ja: null
    deleted_in: "v4.0.0"
    reason: "Appending a (v3) suffix to SKILL.md H1 titles is deprecated. v4 does not add version suffixes to H1."
    # Note: this term is too generic to use as-is.
    # Instead, use pattern matching limited to H1 lines in check-residue.sh
    # (grep -rn "^# .*(v3)" skills/ agents/ to search)
    # This concept is recorded as a comment but is excluded from term-based scanning.
    _scan_disabled: true
    allowlist:
      - "CHANGELOG.md"

  - term: "Node.js 18+"
    term_ja: null
    replacement: "Go 1.22+"
    replacement_ja: "Go 1.22+"
    deleted_in: "v4.0.0"
    reason: "v3's Node.js dependency was removed. v4 Go binary requires no runtime. Node.js requirements in documentation are a false requirement."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - "out/"
      - "output/"
      - "Plans.md"
      - ".opencode/"  # opencode is a separate runtime
      - "codex/"  # codex is a separate runtime
      - "skills/generate-video/"  # video generation skill may use Node.js
      - "opencode/"
      - "archive/"  # non-Claude runtime historical archive
      - ".claude/rules/migration-policy.md"  # Phase 40 historical description (appendix contains legacy runtime requirements)

  - term: "claude-mem"
    term_ja: null
    replacement: "harness-mem"
    replacement_ja: "harness-mem"
    deleted_in: "v4.0.3"
    reason: "Dependency on third-party claude-mem (thedotmack) was removed. Session memory is now unified to Harness-native harness-mem. claude-mem auto-generates commands/*/CLAUDE.md files, causing erroneous skill registration."
    allowlist:
      - "CHANGELOG.md"
      - ".claude/memory/archive/"
      - ".claude/worktrees/"
      - ".claude/state/"
      - "out/"
      - "output/"
      - "Plans.md"
      - "docs/social/"  # v3-era social media posts
      - "docs/CLAUDE-feature-table.md"  # historical CC compatibility record
      - ".claude/rules/"  # historical descriptions such as migration-policy
      - "**/CLAUDE.md"  # files generated by claude-mem are already gitignored; local untracked files are treated as outside scan scope
      - "harness-ui-archive/"  # archived UI project (legacy feature dependent on claude-mem; not to be reused)
      - ".claude/Plans.md"  # local Plans.md
      - ".claude/memory/"  # local memory archive (decisions.md, patterns.md)
      - ".claude/agent-memory/"  # local agent memory
      - ".claude/plugins/cache/"  # plugin cache
      - ".cursor/"  # Cursor IDE local settings
      - "docs/design/"  # UI design documents (legacy feature design dependent on claude-mem)
      - "docs/research/"  # research documents (includes claude-mem integration research)
      - "go/cmd/harness/mem.go"  # harness-mem health check implementation (legitimate reference inspecting the ~/.claude-mem/ path)
      - "go/cmd/harness/mem_test.go"  # mem health tests (mock ~/.claude-mem/ with TempDir)
      - "go/internal/session/monitor_test.go"  # monitor mem health regression tests (comment referencing ~/.claude-mem/ for v4.3.3 not-configured regression fix)
      - "go/.claude/state/"  # gitignored session state snapshot (same treatment as .claude/state/; added as separate prefix because it's in a subdirectory)
      - "go/cmd/harness/main.go"  # usage display for harness mem subcommand
      - "go/harness"  # built binary (contains symbols from mem.go)
      - "bin/harness"  # built harness binary and platform variants (harness-darwin-amd64 etc. covered simultaneously by prefix match). Legacy binaries like bin/claude-mem remain outside allowlist and are still detection targets.
