# tdd-paths.yaml
#
# Purpose:
#   Phase 68 - SSOT for per-language src<->test file mapping for TDD enforcement.
#   Referenced by scripts/detect-test-framework.sh and scripts/hook-handlers/tdd-enforce.sh
#   (Phase B implementation). Provides the criteria by which the R14 guardrail rule
#   determines "when writing a src file, does the corresponding test file exist?"
#
# Schema: tdd-paths.v1
#   {
#     schema_version: "tdd-paths.v1",
#     languages: {
#       <lang>: {
#         src_patterns: [glob...],
#         test_patterns: [glob...],
#         framework_detect_files: [path...],
#         framework_command_default: "...",
#         src_to_test_map: [{from: "...", to: ["..."]}]
#       }
#     },
#     overrides: [{glob, framework}]  # optional, for polyglot monorepos
#   }
#
# Default:
#   Provides basic mappings for 4 languages: node / go / python / rust.
#   Writes to unregistered languages do not trigger test requirements (prevents false positives).
#
# Update Rules:
#   1. The languages key is unique per language identifier (node / go / python / rust / ...)
#   2. src_patterns are globs (bash extglob / Go filepath.Match compatible)
#   3. test_patterns must be mutually exclusive with src (test files themselves are not R14 targets)
#   4. src_to_test_map[].from is a pattern containing placeholders {name} / {dir}
#   5. src_to_test_map[].to has one or more candidates (the first existing one is used)
#   6. The first hit in framework_detect_files adopts framework_command_default
#   7. An invalid schema causes scripts/detect-test-framework.sh to exit 1
#   8. Full specification: docs/TDD_ENFORCEMENT.md (to be created in Phase B.3)
#
# Priority patterns for avoiding false positives (aligned with R14 gate):
#   - Writes to test files themselves are always approved (excluded at gate 5)
#   - Writes to paths without sprint-contract.json are always approved (gate 6 not satisfied)
#   - Paths linked to a contract where tdd_required != true are always approved (gate 6 not satisfied)
#   - When tdd.enforce.level != "max", this file is not referenced at all (short-circuits at gate 1)
#

schema_version: tdd-paths.v1

languages:
  node:
    src_patterns:
      - "src/**/*.ts"
      - "src/**/*.tsx"
      - "src/**/*.js"
      - "src/**/*.jsx"
      - "src/**/*.mjs"
      - "app/**/*.ts"
      - "app/**/*.tsx"
      - "lib/**/*.ts"
      - "lib/**/*.js"
      - "mcp-server/src/**/*.ts"
      - "harness-ui/src/**/*.ts"
      - "harness-ui/src/**/*.tsx"
    test_patterns:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.test.js"
      - "**/*.test.jsx"
      - "**/*.test.mjs"
      - "**/*.spec.ts"
      - "**/*.spec.tsx"
      - "**/*.spec.js"
      - "**/__tests__/**"
      - "tests/**"
    framework_detect_files:
      - "vitest.config.ts"
      - "vitest.config.js"
      - "vitest.config.mjs"
      - "jest.config.js"
      - "jest.config.ts"
      - "jest.config.mjs"
      - "package.json"
    framework_command_default: "npm test"
    src_to_test_map:
      - from: "src/{name}.ts"
        to:
          - "tests/{name}.test.ts"
          - "src/{name}.test.ts"
          - "src/__tests__/{name}.test.ts"
      - from: "src/{name}.tsx"
        to:
          - "tests/{name}.test.tsx"
          - "src/{name}.test.tsx"
      - from: "src/{name}.js"
        to:
          - "tests/{name}.test.js"
          - "src/{name}.test.js"
      - from: "mcp-server/src/{name}.ts"
        to:
          - "mcp-server/tests/unit/{name}.test.ts"
          - "mcp-server/tests/{name}.test.ts"

  go:
    src_patterns:
      - "**/*.go"
    test_patterns:
      - "**/*_test.go"
    framework_detect_files:
      - "go.mod"
    framework_command_default: "go test ./..."
    src_to_test_map:
      - from: "{dir}/{name}.go"
        to:
          - "{dir}/{name}_test.go"

  python:
    src_patterns:
      - "src/**/*.py"
    test_patterns:
      - "tests/**/test_*.py"
      - "tests/**/*_test.py"
      - "**/test_*.py"
    framework_detect_files:
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
    framework_command_default: "pytest"
    src_to_test_map:
      - from: "src/{name}.py"
        to:
          - "tests/test_{name}.py"
          - "tests/{name}_test.py"

  rust:
    src_patterns:
      - "src/**/*.rs"
    test_patterns:
      - "tests/**/*.rs"
      - "src/**/*_test.rs"
    framework_detect_files:
      - "Cargo.toml"
    framework_command_default: "cargo test"
    src_to_test_map:
      - from: "src/{name}.rs"
        to:
          - "tests/{name}_test.rs"
          - "src/{name}_test.rs"

# ---- per-glob framework override (for future extension, currently empty array) ----
#
# For cases in a polyglot monorepo where "the root is go but the node/web subdirectory uses vitest,"
# add to overrides[]. R14 adopts the framework from the most specific overrides[].glob match,
# and falls back to the languages scan result if none matches.
#
overrides: []
