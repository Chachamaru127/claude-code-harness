# client-redaction.yaml
#
# Purpose:
#   Phase 65.3.2 - SSOT for Layer 2a dictionary-based proper noun redaction.
#   Defines the dictionary for replacing proper nouns such as client names,
#   personal names, and domains retrieved from harness-mem with tokens like
#   [Client_*] / [Person_*] / [Domain_*].
#
# Schema: client-redaction.v1
#   PiiRule-compatible (D43 decision 3): To preserve an upgrade path toward
#   future npm package consolidation, field names (rule_id / replace_with)
#   are made compatible with the PiiRule[] schema in the mem-side
#   mcp-server/src/pii/pii-filter.ts.
#
# Default:
#   clients: [], people: [], domains: []  (all redaction disabled)
#
# Update Rules:
#   1. opt-in default: an empty dict does nothing (prevents accidental redaction)
#   2. rule_id must be unique (globally unique across clients/people/domains)
#   3. name is a literal string match (not a regex — proper noun dictionary)
#   4. aliases are synonyms/abbreviations (optional)
#   5. replace_with is the token after redaction (e.g., "[Client_A]")
#   6. Full specification: docs/cross-project-groups-schema.md (sister doc)
#
# Field compatibility (correspondence with PiiRule, D43 decision 3):
#   client-redaction.v1 (this SSOT)  <-->  pii-filter.ts PiiRule
#   ────────────────────────────────────────────────────────
#   rule_id        <-->  rule_id          (exact match)
#   name           <-->  pattern          (literal vs regex difference)
#   aliases[]      <-->  (not in PiiRule; specific to this SSOT)
#   replace_with   <-->  replace_with     (exact match)
#
#   A schema converter for bidirectional conversion can be used when npm packaging in the future.
#
# Double-replacement guard (D43 decision 4):
#   Text that already contains sentinel marks like `[REDACTED_*]` `[Entity]`
#   `[Client_*]` `[Person_*]` `[Domain_*]` etc. is excluded from redaction.
#   Prevents collision with server-side event-recorder.ts:redactContent.
#
#   Confirmed in harness-mem S110-006 closure (commit 8b34ecb):
#   The server-side [REDACTED_*] format uses uppercase EMAIL / KEY / SECRET / HEX.
#   The client-side sentinel regex [A-Za-z0-9_]+ handles both cases,
#   so the existing implementation has no issues.
#
# Handling envelope signals (defensive note from harness-mem S110-006):
#   The validateProseContainsSignals function in
#   memory-server/src/inject/envelope.ts:94-101 requires each value in
#   signals[] to be present as a substring in prose. If signals contain
#   PII / proper nouns, Layer 2 redaction will break the envelope invariant.
#   Therefore, **signals should contain only structural labels (project names,
#   source identifiers, etc.) and PII / proper nouns should be written on the
#   prose side** — as recommended by the mem-side SoT (envelope contract).
#   This dictionary targets only the prose side.
#

schema_version: client-redaction.v1

clients: []
people: []
domains: []

# ---- Configuration examples (commented-out templates) ----
#
# clients:
#   - rule_id: client-001
#     name: NoraiCorp
#     aliases:
#       - Norai Corp
#       - Norai Inc.
#     replace_with: "[Client_A]"
