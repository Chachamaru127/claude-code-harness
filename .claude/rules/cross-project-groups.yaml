# cross-project-groups.yaml
#
# Purpose:
#   Definition of cross-project search target groups introduced in
#   Phase 65.3 (Cross-Project Group + 3-Layer Redaction).
#   Used opt-in via the --cross-project-group <name> flag from
#   the harness-plan-brief / harness-accept / harness-progress skills.
#
# Schema: cross-project-group.v1
#   {schema_version, groups: [{name, members[], description?}]}
#
# Default:
#   groups: []  <- cross-project search is disabled (requires explicit opt-in)
#
# Update Rules:
#   1. Groups must be explicitly opted in; default is empty (prevents accidental cross-project searches)
#   2. groups[].name must be unique within groups
#   3. Elements within groups[].members must be unique (no duplicates)
#   4. Invalid schema causes scripts/load-cross-project-groups.sh to exit 1
#   5. Full specification: docs/cross-project-groups-schema.md
#
# Cross-Project Search Flow (D43 Option alpha):
#   client (skill) -> load-cross-project-groups.sh converts yaml -> JSON
#   -> Issues mcp__harness__harness_mem_search once per member project
#      (N-call required because MCP has no projects array)
#   -> client merges, deduplicates, and sorts results by relevance_score
#   -> Layer 2 (dict + NER) and Layer 3 (final scan) redact proper nouns
#

schema_version: cross-project-group.v1

groups: []

