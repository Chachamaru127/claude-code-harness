  <title>依頼した作業は、どこを通って完了まで進むのか？ — CLAUDE CODE HARNESS / インタラクティブ</title>
  <style>
    :root {
      --bg: #f5f4f1;
      --surface: #fcfbf9;
      --surface-2: #f0efea;
      --ink: #1b1b22;
      --ink-soft: #5a5a64;
      --ink-faint: #8c8c92;
      --line: #e4e2db;
      --line-strong: #d2cfc6;
      --primary: #313a7e;
      --primary-soft: #e9eaf4;
      --primary-ink: #262e66;
      --kernel: #191b2c;
      --kernel-2: #23263c;
      --kernel-line: #343750;
      --kernel-ink: #c9cbe0;
      --done: #2f8f5b;
      --done-soft: #e4f2ea;
      --wip: #b8821c;
      --wip-soft: #f6edd8;
      --risk: #b5462f;
      --risk-soft: #f6e7e2;
      --plain: #1f7a6d;
      --plain-soft: #e1f1ee;
      --plain-line: #bbe0d9;
      --radius: 12px;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
      background: var(--bg);
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(49, 58, 126, 0.08), transparent 28rem),
        var(--bg);
      font-family: var(--sans);
      line-height: 1.75;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }

    button,
    summary {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(49, 58, 126, 0.34);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    .wrap {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
    }

    .hero {
      margin: 24px auto 18px;
      padding: clamp(24px, 4vw, 48px);
      overflow: hidden;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(49, 58, 126, 0.96), rgba(25, 27, 44, 0.98)),
        var(--kernel);
      border: 1px solid var(--kernel-line);
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(25, 27, 44, 0.16);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #bfc3ff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 900px;
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3.4rem);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .thesis {
      max-width: 980px;
      margin: 24px 0 0;
      padding: 14px 18px;
      color: #f4f5ff;
      background: rgba(255, 255, 255, 0.08);
      border-left: 4px solid #9ca3ff;
      border-radius: 0 10px 10px 0;
      font-size: clamp(1rem, 1.7vw, 1.2rem);
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-top: 18px;
      color: var(--kernel-ink);
      font-size: 0.82rem;
    }

    .explorer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
      gap: 18px;
      align-items: start;
      margin-bottom: 18px;
    }

    .card {
      min-width: 0;
      background: rgba(252, 251, 249, 0.94);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 10px 34px rgba(27, 27, 34, 0.07);
    }

    .canvas-card {
      overflow: hidden;
    }

    .canvas-head {
      display: grid;
      gap: 14px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .canvas-title-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: space-between;
    }

    .section-label {
      margin: 0 0 3px;
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .canvas-head h2,
    .side-section h2 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.35;
    }

    .flow-description {
      margin: 5px 0 0;
      color: var(--ink-soft);
      font-size: 0.88rem;
    }

    .view-state {
      flex: 0 0 auto;
      padding: 5px 9px;
      color: var(--primary-ink);
      background: var(--primary-soft);
      border: 1px solid #cfd2ec;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .plain-summary {
      margin: 0;
      padding: 12px 14px;
      color: #15564d;
      background: var(--plain-soft);
      border: 1px solid var(--plain-line);
      border-radius: 10px;
      font-size: 0.92rem;
    }

    .plain-summary strong {
      display: block;
      margin-bottom: 2px;
      font-size: 0.76rem;
      letter-spacing: 0.06em;
    }

    .canvas-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .control-button {
      min-height: 38px;
      padding: 7px 12px;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      font-size: 0.82rem;
      font-weight: 750;
    }

    .control-button:hover:not(:disabled) {
      border-color: var(--primary);
    }

    .control-button[aria-pressed="true"] {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .control-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .diagram-shell {
      max-width: 100%;
      padding: 18px;
      overflow-x: auto;
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        var(--kernel);
      background-size: 24px 24px;
      scrollbar-color: var(--kernel-line) var(--kernel);
    }

    .diagram {
      position: relative;
      display: grid;
      gap: 14px;
      min-width: 760px;
      min-height: 470px;
      isolation: isolate;
    }

    .edge-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .lane {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 12px;
      background: rgba(35, 38, 60, 0.78);
      border: 1px solid var(--kernel-line);
      border-radius: 12px;
    }

    .lane-title {
      min-height: 42px;
      margin: 0 0 12px;
      padding-bottom: 9px;
      color: #aeb3e7;
      border-bottom: 1px solid var(--kernel-line);
      font-size: 0.73rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .lane-nodes {
      display: grid;
      gap: 54px;
      align-content: start;
    }

    .node-card {
      position: relative;
      z-index: 3;
      min-height: 90px;
      padding: 13px;
      color: #f0f1ff;
      background: #2b2e47;
      border: 1px solid #484c6b;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(8, 9, 18, 0.22);
      transition:
        opacity 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease,
        transform 160ms ease;
    }

    .node-card.is-dim {
      opacity: 0.25;
    }

    .node-card.is-flow {
      border-color: #99a0ff;
      box-shadow: 0 0 0 2px rgba(153, 160, 255, 0.16);
    }

    .node-card.is-step {
      border-color: #fff;
      box-shadow:
        0 0 0 3px rgba(153, 160, 255, 0.38),
        0 12px 26px rgba(8, 9, 18, 0.34);
      transform: translateY(-2px);
    }

    .node-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 850;
      line-height: 1.35;
    }

    .node-summary {
      display: block;
      margin-top: 7px;
      color: var(--kernel-ink);
      font-size: 0.73rem;
      line-height: 1.55;
    }

    .edge-line {
      fill: none;
      stroke: #656982;
      stroke-width: 1.5;
      opacity: 0.2;
      transition:
        opacity 160ms ease,
        stroke 160ms ease,
        stroke-width 160ms ease;
    }

    .edge-line.is-flow {
      stroke: #a7adff;
      stroke-width: 3;
      opacity: 0.88;
    }

    .edge-line.is-step {
      stroke: #fff;
      stroke-width: 5;
      opacity: 1;
    }

    .step-badge circle {
      fill: var(--primary);
      stroke: #fff;
      stroke-width: 1.5;
    }

    .step-badge.is-current circle {
      fill: #fff;
      stroke: var(--primary);
      stroke-width: 3;
    }

    .step-badge text {
      fill: #fff;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .step-badge.is-current text {
      fill: var(--primary);
    }

    .sidebar {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .side-section {
      padding: 18px;
    }

    .side-head {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .side-count {
      color: var(--ink-faint);
      font-size: 0.74rem;
    }

    .flow-list,
    .step-list {
      display: grid;
      gap: 8px;
    }

    .flow-button {
      width: 100%;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .flow-button:hover {
      border-color: #aeb2d6;
    }

    .flow-button[aria-pressed="true"] {
      background: var(--primary-soft);
      border-color: var(--primary);
      box-shadow: inset 4px 0 0 var(--primary);
    }

    .flow-button-title {
      display: block;
      font-size: 0.88rem;
      font-weight: 850;
      line-height: 1.4;
    }

    .flow-button-description {
      display: block;
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 0.72rem;
      line-height: 1.5;
    }

    .step-card {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .step-card.is-current {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(49, 58, 126, 0.1);
    }

    .step-select {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      background: transparent;
      border: 0;
    }

    .step-select:hover {
      background: var(--surface-2);
    }

    .step-number {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: #fff;
      background: var(--primary);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 900;
    }

    .step-route {
      display: block;
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 850;
      line-height: 1.4;
    }

    .step-action {
      display: block;
      margin-top: 3px;
      font-size: 0.86rem;
      font-weight: 850;
      line-height: 1.4;
    }

    .step-description {
      display: block;
      margin-top: 5px;
      color: var(--ink-soft);
      font-size: 0.76rem;
      line-height: 1.58;
    }

    .step-more {
      padding: 0 12px 10px 54px;
      color: var(--ink-soft);
      font-size: 0.73rem;
    }

    .step-more summary {
      cursor: pointer;
      color: var(--primary);
      font-weight: 800;
    }

    .detail-grid {
      display: grid;
      gap: 7px;
      margin: 8px 0 0;
    }

    .detail-row {
      margin: 0;
    }

    .detail-row strong {
      color: var(--ink);
    }

    code {
      font-family: var(--mono);
      font-size: 0.92em;
    }

    .error-box,
    .noscript {
      margin: 18px;
      padding: 14px;
      color: #7f2c1e;
      background: var(--risk-soft);
      border: 1px solid #e5c0b4;
      border-radius: 10px;
    }

    .report-footer {
      margin-bottom: 28px;
      padding: 18px 20px;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      font-size: 0.78rem;
    }

    .report-footer strong {
      color: var(--ink);
    }

    .source-list {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    @media (max-width: 960px) {
      .explorer {
        grid-template-columns: 1fr;
      }

      .sidebar {
        grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
      }
    }

    @media (max-width: 680px) {
      .wrap {
        width: min(100% - 20px, 1440px);
      }

      .hero {
        margin-top: 10px;
        padding: 22px 18px;
        border-radius: 14px;
      }

      .canvas-title-row {
        display: grid;
      }

      .view-state {
        width: fit-content;
      }

      .sidebar {
        grid-template-columns: 1fr;
      }

      .diagram {
        min-width: 640px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }

      body {
        background: #fff;
      }

      .wrap {
        width: 100%;
      }

      .hero {
        margin-top: 0;
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .explorer {
        display: block;
      }

      .canvas-card,
      .side-section,
      .report-footer {
        box-shadow: none;
        break-inside: avoid;
      }

      .canvas-controls,
      .flow-section {
        display: none;
      }

      .diagram-shell {
        overflow: visible;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .diagram {
        min-width: 0;
      }

      .node-card,
      .edge-line {
        opacity: 1 !important;
      }

      .sidebar {
        margin-top: 12px;
      }

      .step-card {
        break-inside: avoid;
      }
    }
  </style>
</head>

      </noscript>
    </section>

    <aside class="sidebar" aria-label="流れと処理の順番">
      <section class="card side-section flow-section" aria-labelledby="flows-heading">
        <div class="side-head">
          <div>
            <p class="section-label">1つ選ぶ</p>
            <h2 id="flows-heading">見たい流れを選ぶ</h2>
          </div>
          <span class="side-count" id="flow-count"></span>
        </div>
        <div class="flow-list" id="flow-list" role="list"></div>
      </section>

      <section class="card side-section" aria-labelledby="steps-heading">
        <div class="side-head">
          <div>
            <p class="section-label">上から順に読む</p>
            <h2 id="steps-heading">処理の順番</h2>
          </div>
          <span class="side-count" id="step-count"></span>
        </div>
        <div class="step-list" id="step-list" role="list"></div>
      </section>
    </aside>

    <p id="workflow-status" class="visually-hidden" aria-live="polite"></p>
  </main>

  <footer class="report-footer wrap">

  <script>
    (() => {
      "use strict";

      const svgNamespace = "http://www.w3.org/2000/svg";
      const elements = {
        projectName: document.getElementById("project-name"),
        reportTitle: document.getElementById("report-title"),
        reportThesis: document.getElementById("report-thesis"),
        generatedAt: document.getElementById("generated-at"),
        diagram: document.getElementById("diagram"),
        edgeLayer: document.getElementById("edge-layer"),
        flowList: document.getElementById("flow-list"),
        stepList: document.getElementById("step-list"),
        activeFlowTitle: document.getElementById("active-flow-title"),
        activeFlowDescription: document.getElementById("active-flow-description"),
        plainSummary: document.getElementById("plain-summary"),
        flowCount: document.getElementById("flow-count"),
        stepCount: document.getElementById("step-count"),
        viewState: document.getElementById("view-state"),
        status: document.getElementById("workflow-status"),
        previous: document.getElementById("previous-step"),
        overview: document.getElementById("show-overview"),
        next: document.getElementById("next-step"),
        sourceList: document.getElementById("source-list")
      };

      let data;

      try {
        data = JSON.parse(document.getElementById("report-data").textContent);
        const errors = validateData(data);
        if (errors.length) throw new Error(errors.join(" / "));
      } catch (error) {
        showError(error.message);
        return;
      }

      const nodeMap = new Map(data.nodes.map((node) => [node.id, node]));
      const edgeMap = new Map(data.edges.map((edge) => [edge.id, edge]));
      const state = {
        flowIndex: 0,
        stepIndex: null,
        printStepIndex: null,
        openedDetails: []
      };

      applyMetadata();
      renderDiagramNodes();
      renderFlowList();
      selectFlow(0);
      attachControls();

      let resizeFrame = 0;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(drawEdges);
      });

      window.addEventListener("beforeprint", preparePrint);
      window.addEventListener("afterprint", restoreAfterPrint);

      function applyMetadata() {
        document.title = data.meta.title;
        elements.projectName.textContent = `${data.meta.project} / INTERACTIVE WORKFLOW`;
        elements.reportTitle.textContent = data.meta.title;
        elements.reportThesis.textContent = data.meta.thesis;
        elements.generatedAt.textContent = `作成日: ${data.meta.generatedAt || "未設定"}`;
        elements.flowCount.textContent = `${data.flows.length}件`;

        elements.sourceList.replaceChildren();
        for (const source of data.meta.sourceRefs || []) {
          const item = document.createElement("li");
          const code = document.createElement("code");
          code.textContent = source;
          item.append(code);
          elements.sourceList.append(item);
        }
      }

      function renderDiagramNodes() {
        const fragment = document.createDocumentFragment();
        elements.diagram.style.gridTemplateColumns =
          `repeat(${data.categories.length}, minmax(170px, 1fr))`;

        for (const category of data.categories) {
          const lane = document.createElement("section");
          lane.className = "lane";
          lane.setAttribute("aria-label", category.label);

          const title = document.createElement("h3");
          title.className = "lane-title";
          title.textContent = category.label;
          lane.append(title);

          const nodeList = document.createElement("div");
          nodeList.className = "lane-nodes";

          for (const node of data.nodes.filter((item) => item.categoryId === category.id)) {
            const card = document.createElement("div");
            card.className = "node-card";
            card.id = `node-${node.id}`;
            card.dataset.nodeId = node.id;

            const label = document.createElement("span");
            label.className = "node-label";
            label.textContent = node.label;

            const summary = document.createElement("span");
            summary.className = "node-summary";
            summary.textContent = node.summary || "";

            card.append(label, summary);
            nodeList.append(card);
          }

          lane.append(nodeList);
          fragment.append(lane);
        }

        elements.diagram.append(fragment);
      }

      function renderFlowList() {
        elements.flowList.replaceChildren();

        data.flows.forEach((flow, index) => {
          const item = document.createElement("div");
          item.setAttribute("role", "listitem");

          const button = document.createElement("button");
          button.className = "flow-button";
          button.type = "button";
          button.dataset.flowIndex = String(index);
          button.setAttribute("aria-pressed", "false");

          const title = document.createElement("span");
          title.className = "flow-button-title";
          title.textContent = flow.title;

          const description = document.createElement("span");
          description.className = "flow-button-description";
          description.textContent = flow.description;

          button.append(title, description);
          button.addEventListener("click", () => selectFlow(index));
          button.addEventListener("keydown", (event) => {
            moveFocus(event, ".flow-button", index);
          });
          item.append(button);
          elements.flowList.append(item);
        });
      }

      function selectFlow(index) {
        state.flowIndex = index;
        state.stepIndex = null;

        for (const button of elements.flowList.querySelectorAll(".flow-button")) {
          button.setAttribute(
            "aria-pressed",
            String(Number(button.dataset.flowIndex) === state.flowIndex)
          );
        }

        renderSteps();
        updateView();
      }

      function renderSteps() {
        const flow = currentFlow();
        elements.stepList.replaceChildren();
        elements.stepCount.textContent = `${flow.steps.length}段階`;

        flow.steps.forEach((step, index) => {
          const edge = edgeMap.get(step.edgeId);
          const source = nodeMap.get(edge.sourceNodeId);
          const target = nodeMap.get(edge.targetNodeId);

          const card = document.createElement("article");
          card.className = "step-card";
          card.dataset.stepIndex = String(index);
          card.setAttribute("role", "listitem");

          const button = document.createElement("button");
          button.className = "step-select";
          button.type = "button";
          button.dataset.stepIndex = String(index);

          const number = document.createElement("span");
          number.className = "step-number";
          number.textContent = String(step.stepNumber);

          const copy = document.createElement("span");

          const route = document.createElement("span");
          route.className = "step-route";
          route.textContent = `${source.label} → ${target.label}`;

          const action = document.createElement("span");
          action.className = "step-action";
          action.textContent = step.action;

          const description = document.createElement("span");
          description.className = "step-description";
          description.textContent = step.description;

          copy.append(route, action, description);
          button.append(number, copy);
          button.addEventListener("click", () => selectStep(index));
          button.addEventListener("keydown", (event) => {
            moveFocus(event, ".step-select", index);
          });
          card.append(button);

          const details = buildStepDetails(step);
          if (details) card.append(details);
          elements.stepList.append(card);
        });
      }

      function buildStepDetails(step) {
        if (!step.why && !step.payload && !step.codeReference) return null;

        const details = document.createElement("details");
        details.className = "step-more";

        const summary = document.createElement("summary");
        summary.textContent = "理由、受け渡す情報、コードを見る";
        details.append(summary);

        const grid = document.createElement("div");
        grid.className = "detail-grid";

        const fields = [
          ["なぜ", step.why],
          ["受け渡すもの", step.payload],
          ["コード参照", step.codeReference]
        ];

        for (const [label, value] of fields) {
          if (!value) continue;
          const row = document.createElement("p");
          row.className = "detail-row";
          const strong = document.createElement("strong");
          strong.textContent = `${label}: `;
          row.append(strong);

          if (label === "コード参照") {
            const code = document.createElement("code");
            code.textContent = value;
            row.append(code);
          } else {
            row.append(document.createTextNode(value));
          }
          grid.append(row);
        }

        details.append(grid);
        return details;
      }

      function selectStep(index) {
        state.stepIndex = index;
        updateView();
        const selected = elements.stepList.querySelector(`[data-step-index="${index}"]`);
        selected?.scrollIntoView({
          block: "nearest",
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "auto"
            : "smooth"
        });
      }

      function updateView() {
        const flow = currentFlow();
        const currentStep = state.stepIndex === null ? null : flow.steps[state.stepIndex];

        elements.activeFlowTitle.textContent = flow.title;
        elements.activeFlowDescription.textContent = flow.description;
        elements.plainSummary.textContent = flow.plainSummary;
        elements.viewState.textContent = currentStep
          ? `段階 ${currentStep.stepNumber}/${flow.steps.length}`
          : `流れ全体・${flow.steps.length}段階`;
        elements.status.textContent = currentStep
          ? `${flow.title}、段階${currentStep.stepNumber}/${flow.steps.length}を表示`
          : `${flow.title}、流れ全体${flow.steps.length}段階を表示`;

        elements.overview.setAttribute("aria-pressed", String(state.stepIndex === null));
        elements.previous.disabled = state.stepIndex === null;
        elements.next.disabled = state.stepIndex === flow.steps.length - 1;

        const flowEdgeIds = new Set(flow.steps.map((step) => step.edgeId));
        const flowNodeIds = new Set();
        for (const edgeId of flowEdgeIds) {
          const edge = edgeMap.get(edgeId);
          flowNodeIds.add(edge.sourceNodeId);
          flowNodeIds.add(edge.targetNodeId);
        }

        const stepNodeIds = new Set();
        if (currentStep) {
          const edge = edgeMap.get(currentStep.edgeId);
          stepNodeIds.add(edge.sourceNodeId);
          stepNodeIds.add(edge.targetNodeId);
        }

        for (const card of elements.diagram.querySelectorAll(".node-card")) {
          const nodeId = card.dataset.nodeId;
          card.classList.toggle("is-dim", !flowNodeIds.has(nodeId));
          card.classList.toggle("is-flow", flowNodeIds.has(nodeId));
          card.classList.toggle("is-step", stepNodeIds.has(nodeId));
        }

        for (const card of elements.stepList.querySelectorAll(".step-card")) {
          const isCurrent = Number(card.dataset.stepIndex) === state.stepIndex;
          card.classList.toggle("is-current", isCurrent);
          const button = card.querySelector(".step-select");
          if (isCurrent) {
            button.setAttribute("aria-current", "step");
          } else {
            button.removeAttribute("aria-current");
          }
        }

        requestAnimationFrame(drawEdges);
      }

      function drawEdges() {
        const flow = currentFlow();
        const currentStep = state.stepIndex === null ? null : flow.steps[state.stepIndex];
        const flowEdgeIds = new Set(flow.steps.map((step) => step.edgeId));
        const bounds = elements.diagram.getBoundingClientRect();

        elements.edgeLayer.replaceChildren(buildMarkers());
        elements.edgeLayer.setAttribute("viewBox", `0 0 ${bounds.width} ${bounds.height}`);

        for (const edge of data.edges) {
          const sourceElement = document.getElementById(`node-${edge.sourceNodeId}`);
          const targetElement = document.getElementById(`node-${edge.targetNodeId}`);
          if (!sourceElement || !targetElement) continue;

          const source = sourceElement.getBoundingClientRect();
          const target = targetElement.getBoundingClientRect();
          const geometry = edgeGeometry(source, target, bounds);
          const path = document.createElementNS(svgNamespace, "path");
          const isFlow = flowEdgeIds.has(edge.id);
          const isCurrent = currentStep?.edgeId === edge.id;

          path.setAttribute("d", geometry.path);
          path.setAttribute("class", [
            "edge-line",
            isFlow ? "is-flow" : "",
            isCurrent ? "is-step" : ""
          ].filter(Boolean).join(" "));
          path.setAttribute(
            "marker-end",
            isCurrent
              ? "url(#arrow-step)"
              : isFlow
                ? "url(#arrow-flow)"
                : "url(#arrow-dim)"
          );
          elements.edgeLayer.append(path);

          const matchingSteps = flow.steps.filter((step) => step.edgeId === edge.id);
          matchingSteps.forEach((step, badgeIndex) => {
            const badge = createStepBadge(
              step.stepNumber,
              geometry.midX,
              geometry.midY + badgeIndex * 26,
              currentStep?.stepNumber === step.stepNumber
            );
            elements.edgeLayer.append(badge);
          });
        }
      }

      function edgeGeometry(source, target, bounds) {
        const sourceCenterX = source.left + source.width / 2;
        const targetCenterX = target.left + target.width / 2;
        const forward = targetCenterX >= sourceCenterX;
        const x1 = (forward ? source.right : source.left) - bounds.left;
        const y1 = source.top + source.height / 2 - bounds.top;
        const x2 = (forward ? target.left : target.right) - bounds.left;
        const y2 = target.top + target.height / 2 - bounds.top;
        const curve = Math.max(42, Math.abs(x2 - x1) * 0.46);
        const direction = forward ? 1 : -1;
        const c1x = x1 + curve * direction;
        const c2x = x2 - curve * direction;

        return {
          path: `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`,
          midX: (x1 + x2) / 2,
          midY: (y1 + y2) / 2
        };
      }

      function buildMarkers() {
        const definitions = document.createElementNS(svgNamespace, "defs");
        const markers = [
          ["arrow-dim", "#656982", 0.35],
          ["arrow-flow", "#a7adff", 1],
          ["arrow-step", "#ffffff", 1]
        ];

        for (const [id, color, opacity] of markers) {
          const marker = document.createElementNS(svgNamespace, "marker");
          marker.id = id;
          marker.setAttribute("viewBox", "0 0 10 10");
          marker.setAttribute("refX", "9");
          marker.setAttribute("refY", "5");
          marker.setAttribute("markerWidth", "7");
          marker.setAttribute("markerHeight", "7");
          marker.setAttribute("orient", "auto-start-reverse");

          const arrow = document.createElementNS(svgNamespace, "path");
          arrow.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
          arrow.setAttribute("fill", color);
          arrow.setAttribute("opacity", String(opacity));
          marker.append(arrow);
          definitions.append(marker);
        }

        return definitions;
      }

      function createStepBadge(number, x, y, isCurrent) {
        const group = document.createElementNS(svgNamespace, "g");
        group.setAttribute(
          "class",
          `step-badge${isCurrent ? " is-current" : ""}`
        );
        group.setAttribute("transform", `translate(${x} ${y})`);

        const circle = document.createElementNS(svgNamespace, "circle");
        circle.setAttribute("r", isCurrent ? "13" : "11");

        const text = document.createElementNS(svgNamespace, "text");
        text.textContent = String(number);

        group.append(circle, text);
        return group;
      }

      function attachControls() {
        elements.overview.addEventListener("click", () => {
          state.stepIndex = null;
          updateView();
        });

        elements.previous.addEventListener("click", () => {
          if (state.stepIndex === null) return;
          if (state.stepIndex === 0) {
            state.stepIndex = null;
            updateView();
          } else {
            selectStep(state.stepIndex - 1);
          }
        });

        elements.next.addEventListener("click", () => {
          const flow = currentFlow();
          if (state.stepIndex === null) {
            selectStep(0);
          } else if (state.stepIndex < flow.steps.length - 1) {
            selectStep(state.stepIndex + 1);
          }
        });
      }

      function moveFocus(event, selector, index) {
        if (!["ArrowDown", "ArrowUp"].includes(event.key)) return;
        event.preventDefault();
        const container = selector === ".step-select"
          ? elements.stepList
          : elements.flowList;
        const buttons = [...container.querySelectorAll(selector)];
        const delta = event.key === "ArrowDown" ? 1 : -1;
        buttons[(index + delta + buttons.length) % buttons.length]?.focus();
      }

      function currentFlow() {
        return data.flows[state.flowIndex];
      }

      function validateData(value) {
        const errors = [];
        const arrays = ["categories", "nodes", "edges", "flows"];

        if (!value?.meta?.title) errors.push("meta.titleがありません");
        if (!value?.meta?.thesis) errors.push("meta.thesisがありません");

        for (const key of arrays) {
          if (!Array.isArray(value?.[key]) || value[key].length === 0) {
            errors.push(`${key}が空です`);
          }
        }
        if (errors.length) return errors;

        const ids = (items) => new Set(items.map((item) => item.id));
        const categoryIds = ids(value.categories);
        const nodeIds = ids(value.nodes);
        const edgeIds = ids(value.edges);

        for (const node of value.nodes) {
          if (!categoryIds.has(node.categoryId)) {
            errors.push(`${node.id}のcategoryIdが不正です`);
          }
        }
        for (const edge of value.edges) {
          if (!nodeIds.has(edge.sourceNodeId) || !nodeIds.has(edge.targetNodeId)) {
            errors.push(`${edge.id}のnode参照が不正です`);
          }
        }
        for (const flow of value.flows) {
          flow.steps?.forEach((step, index) => {
            if (step.stepNumber !== index + 1) {
              errors.push(`${flow.id}のstepNumberが連番ではありません`);
            }
            if (!edgeIds.has(step.edgeId)) {
              errors.push(`${flow.id}が存在しないedgeを参照しています`);
            }
          });
        }
        return errors;
      }

      function showError(message) {
        const box = document.createElement("div");
        box.className = "error-box";
        box.setAttribute("role", "alert");
        box.textContent = `レポートデータを表示できません: ${message}`;
        elements.diagram.replaceChildren(box);
      }

      function preparePrint() {
        state.printStepIndex = state.stepIndex;
        state.openedDetails = [...document.querySelectorAll(".step-more")]
          .filter((details) => details.open);
        for (const details of document.querySelectorAll(".step-more")) details.open = true;
        state.stepIndex = null;
        updateView();
        requestAnimationFrame(drawEdges);
      }

      function restoreAfterPrint() {
        for (const details of document.querySelectorAll(".step-more")) {
          details.open = state.openedDetails.includes(details);
        }
        state.stepIndex = state.printStepIndex;
        updateView();
      }
    })();
  </script>
</body>
</html>
