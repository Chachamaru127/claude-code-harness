<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="Claude Code Harness の運用ループ: 計画、実装、レビュー、リリース。すべてのコマンドは実行直前にフロアを通る">
  <title>計画 → 実装 → レビュー → リリース。すべてのコマンドは実行直前に検査される</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9A978D"/>
    </marker>
    <marker id="arLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#A8A59B"/>
    </marker>
  </defs>

  <style>
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .jp   { font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN",
            "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }

    .stage      { fill:#FCFBF9; stroke:#DFDCD3; stroke-width:1.2; }
    .stage-lbl  { fill:#1B1B22; font-size:16px; font-weight:700; letter-spacing:.08em; text-anchor:middle; }
    .stage-sub  { fill:#5A5A64; font-size:11px; text-anchor:middle; }
    .cmd        { fill:#918E96; font-size:9.5px; text-anchor:middle; }

    .eyebrow    { fill:#313A7E; font-size:10.5px; font-weight:700; letter-spacing:.12em; }
    .floor-band { fill:#FCFBF9; stroke:#DFDCD3; stroke-width:1; }
    .floor-ttl  { fill:#1B1B22; font-size:12.5px; font-weight:700; letter-spacing:.02em; }
    .floor-note { fill:#5A5A64; font-size:10.5px; }
    .chip       { fill:#E4F2EA; stroke:#B7DCC7; stroke-width:1; }
    .chip-lbl   { fill:#1D6B42; font-size:10px; text-anchor:middle; }

    .lit      { animation: lit  8s cubic-bezier(.4,0,.2,1) infinite; }
    .lit-ring { animation: ring 8s cubic-bezier(.4,0,.2,1) infinite; }
    .d1 { animation-delay: 0s }
    .d2 { animation-delay: 1.6s }
    .d3 { animation-delay: 3.2s }
    .d4 { animation-delay: 4.8s }

    @keyframes lit  { 0%,100% { fill:#FCFBF9 } 2%,17% { fill:#E9EAF4 } }
    @keyframes ring { 0%,100% { stroke:#DFDCD3; stroke-width:1.2 } 2%,17% { stroke:#313A7E; stroke-width:2 } }

    .edge { stroke:#9A978D; stroke-width:1.6; fill:none; stroke-dasharray:5 5;
            animation: march 1.1s linear infinite; }
    @keyframes march { to { stroke-dashoffset:-20 } }

    .loop { stroke:#A8A59B; stroke-width:1.4; fill:none; stroke-dasharray:4 6;
            animation: march 1.6s linear infinite; }
    .loop-lbl { fill:#8C8C92; font-size:9.5px; text-anchor:middle; }

    .beat { animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { opacity:.4 } 50% { opacity:1 } }

    @media (prefers-reduced-motion: reduce) {
      .lit, .lit-ring, .edge, .loop, .beat { animation: none }
      .edge, .loop { stroke-dasharray: none }
    }
  </style>

  <rect width="880" height="268" rx="14" fill="#F5F4F1" stroke="#E4E2DB"/>
  <text class="jp eyebrow" x="34" y="34">CLAUDE CODE HARNESS 運用ループ</text>

  <g>
    <rect class="stage lit lit-ring d1" x="34"  y="56" width="186" height="72" rx="9"/>
    <rect class="stage lit lit-ring d2" x="238" y="56" width="186" height="72" rx="9"/>
    <rect class="stage lit lit-ring d3" x="442" y="56" width="186" height="72" rx="9"/>
    <rect class="stage lit lit-ring d4" x="646" y="56" width="186" height="72" rx="9"/>

    <text class="jp stage-lbl" x="127" y="85">計画</text>
    <text class="jp stage-lbl" x="331" y="85">実装</text>
    <text class="jp stage-lbl" x="535" y="85">レビュー</text>
    <text class="jp stage-lbl" x="739" y="85">リリース</text>

    <text class="jp stage-sub" x="127" y="103">仕様と作業一覧</text>
    <text class="jp stage-sub" x="331" y="103">承認された範囲だけ</text>
    <text class="jp stage-sub" x="535" y="103">独立した判定</text>
    <text class="jp stage-sub" x="739" y="103">検証済みの証拠</text>

    <text class="mono cmd" x="127" y="119">/harness-plan</text>
    <text class="mono cmd" x="331" y="119">/harness-work</text>
    <text class="mono cmd" x="535" y="119">/harness-review</text>
    <text class="mono cmd" x="739" y="119">/harness-release</text>
  </g>

  <path class="edge" d="M222 92 H234" marker-end="url(#ar)"/>
  <path class="edge" d="M426 92 H438" marker-end="url(#ar)"/>
  <path class="edge" d="M630 92 H642" marker-end="url(#ar)"/>

  <path class="loop" d="M739 132 V148 H127 V132" marker-end="url(#arLoop)"/>
  <rect x="392" y="140" width="84" height="15" rx="7" fill="#F5F4F1"/>
  <text class="jp loop-lbl" x="434" y="151">次の範囲へ</text>

  <rect class="floor-band" x="34" y="164" width="798" height="76" rx="10"/>
  <circle class="beat" cx="56" cy="190" r="4.5" fill="#2F8F5B"/>
  <text class="jp floor-ttl" x="70" y="194">実行時フロア：すべてのコマンドを実行直前に検査</text>
  <text class="jp floor-note" x="70" y="213">どの設定でも無効化できない。ツール呼び出しは必ずここを通る。</text>

  <g>
    <rect class="chip" x="496" y="176" width="52" height="22" rx="11"/>
    <text class="jp chip-lbl" x="522" y="191">課金</text>
    <rect class="chip" x="554" y="176" width="70" height="22" rx="11"/>
    <text class="jp chip-lbl" x="589" y="191">外部送信</text>
    <rect class="chip" x="630" y="176" width="70" height="22" rx="11"/>
    <text class="jp chip-lbl" x="665" y="191">秘密情報</text>
    <rect class="chip" x="706" y="176" width="70" height="22" rx="11"/>
    <text class="jp chip-lbl" x="741" y="191">本番反映</text>
    <rect class="chip" x="646" y="206" width="130" height="22" rx="11"/>
    <text class="jp chip-lbl" x="711" y="221">作業ツリー外の破壊</text>
  </g>

  <text class="jp" x="34" y="258" fill="#8C8C92" font-size="10">ガードレール 15 規則 · フロア 5 分類 · 止めた記録はすべて残る</text>
</svg>
