<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
<title id="title">散らばった作業が計画、実装と検査、別担当の点検へ整い、最後に利用者へ判断が返る</title><desc id="desc">Concept illustration, not a live project status. 12-second loop. Reduced-motion shows the settled work path.</desc>
<defs><radialGradient id="warm"><stop stop-color="#ffe7d9" /><stop offset="1" stop-color="#fff" /></radialGradient><linearGradient id="line"><stop stop-color="#e8d8cb" /><stop offset=".55" stop-color="#f67847" /><stop offset="1" stop-color="#e8d8cb" /></linearGradient></defs>
<style>text{font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans CJK JP',sans-serif;fill:#1b1b22}.sub{font-size:14px;fill:#706b66}.reduced{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.reduced{display:inline}} </style>
<rect width="720" height="390" rx="28" fill="#fcfbf9" /><ellipse cx="670" cy="330" rx="210" ry="170" fill="url(#warm)" opacity=".7" />
<g class="moving"><g id="pain" opacity="0.0"><text x="35" y="64" font-size="35" font-weight="700">AIに頼んだ</text><text x="35" y="108" font-size="35" font-weight="700">その後が、見えない</text></g><g id="result" opacity="1.0"><text x="35" y="64" font-size="35" font-weight="700">仕事の流れが見える</text><text x="35" y="108" font-size="35" font-weight="700">結果を見て、判断できる</text></g></g>
<g class="reduced"><text x="35" y="64" font-size="35" font-weight="700">仕事の流れが見える</text><text x="35" y="108" font-size="35" font-weight="700">結果を見て、判断できる</text></g>
<path d="M220 227H500" stroke="#e6dfd7" stroke-width="2" fill="none" />
<path id="flow" d="M220 227H500" stroke="url(#line)" stroke-width="4" fill="none" stroke-dasharray="280" stroke-dashoffset="0.0" />
<g class="moving"><circle id="pulse" cy="227" cx="500.0" r="6" fill="#f67847" opacity="0.0" /></g>
<g transform="translate(35,160)"><g id="card-0" transform="translate(-0.0,0.0)"><g id="tilt-0" transform="rotate(-0.0 95 67)"><rect x="0" y="5" width="190" height="134" rx="20" fill="#ece8e1" opacity=".55" /><rect width="190" height="134" rx="20" fill="white" stroke="#e5ded5" /><g fill="none" stroke="#f67847" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M70 25h36l13 13v25H70z M106 25v14h13 M80 47h25 M80 55h18" /></g><text x="95" y="91" text-anchor="middle" font-size="25" font-weight="700">計画</text><text x="95" y="115" text-anchor="middle" class="sub">やることを決める</text></g></g></g><g transform="translate(265,160)"><g id="card-1" transform="translate(0.0,-0.0)"><g id="tilt-1" transform="rotate(0.0 95 67)"><rect x="0" y="5" width="190" height="134" rx="20" fill="#ece8e1" opacity=".55" /><rect width="190" height="134" rx="20" fill="white" stroke="#e5ded5" /><g fill="none" stroke="#f67847" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m79 31-12 12 12 12 m32-24 12 12-12 12 m-9-28-11 32" /></g><text x="95" y="91" text-anchor="middle" font-size="25" font-weight="700">実装と検査</text><text x="95" y="115" text-anchor="middle" class="sub">直して、確かめる</text></g></g></g><g transform="translate(495,160)"><g id="card-2" transform="translate(0.0,0.0)"><g id="tilt-2" transform="rotate(-0.0 95 67)"><rect x="0" y="5" width="190" height="134" rx="20" fill="#ece8e1" opacity=".55" /><rect width="190" height="134" rx="20" fill="white" stroke="#e5ded5" /><g fill="none" stroke="#f67847" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="93" cy="41" r="14" /><path d="m104 52 13 13 m-28-24 4 4 7-8" /></g><text x="95" y="91" text-anchor="middle" font-size="25" font-weight="700">別担当の点検</text><text x="95" y="115" text-anchor="middle" class="sub">見落としを探す</text></g></g></g>
