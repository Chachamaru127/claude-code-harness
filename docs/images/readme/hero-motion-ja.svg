<g class="moving"><g id="pain" opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.2;.22;.86;.88;1" dur="12s" repeatCount="indefinite" /><text x="35" y="64" font-size="35" font-weight="700">AIに頼んだ</text><text x="35" y="108" font-size="35" font-weight="700">その後が、見えない</text></g><g id="result" opacity="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.24;.26;.82;.84;1" dur="12s" repeatCount="indefinite" /><text x="35" y="64" font-size="35" font-weight="700">仕事の流れが見える</text><text x="35" y="108" font-size="35" font-weight="700">結果を見て、判断できる</text></g></g>
<g class="reduced"><text x="35" y="64" font-size="35" font-weight="700">仕事の流れが見える</text><text x="35" y="108" font-size="35" font-weight="700">結果を見て、判断できる</text></g>
