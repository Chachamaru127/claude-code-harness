# Claude Code Harness Configuration
# https://github.com/Chachamaru127/claude-code-harness

# Review settings
review:
  # Codex second opinion (requires Codex MCP server)
  codex:
    enabled: true
    timeout_ms: 60000 # Codex MCP timeout (ms)

  # Default mode: "default" (4 perspectives) or "codex" (parallel MCP execution)
  mode: codex

# Breezing settings (Agent Teams)
breezing:
  # Default parallel implementer count
  default_parallel: 2
  # Maximum retake attempts before user escalation
  max_retakes: 3
  # State file path
  state_file: .claude/state/breezing-active.json

# Cleanup thresholds
cleanup:
  plans:
    archive_after_days: 7
    max_lines: 200
  session_log:
    archive_after_days: 30
    max_lines: 500
  claude_md:
    max_lines: 100

# OpenClaw autonomous daemon (Bun + Agent SDK)
openclaw:
  enabled: false
  cron_interval: "*/30 * * * *"    # 30-minute interval
  max_turns: 20                     # Max turns per cron run (global fallback)
  max_budget_usd: 1.00              # Max budget per cron run (global fallback)
  heartbeat:
    enabled: true
    file: "HEARTBEAT.md"            # Heartbeat file path (relative to project_cwd)
    skip_when_empty: true           # Skip API calls when HEARTBEAT.md is empty
  delivery:
    enabled: false
    channel: "line"                 # Delivery channel: line / slack / discord / gmail
    only_when_actions: true         # Only deliver when actions were taken
  services:
    gmail:
      enabled: false
      model: sonnet
      max_turns: 10
      max_budget_usd: 0.40
      priority: high
    calendar:
      enabled: false
      model: haiku
      max_turns: 5
      max_budget_usd: 0.20
      priority: medium
    line:
      enabled: false
      model: sonnet
      max_turns: 6
      max_budget_usd: 0.15
      priority: medium
    slack:
      enabled: false
      model: sonnet
      max_turns: 8
      max_budget_usd: 0.15
      priority: medium
    discord:
      enabled: false
      model: haiku
      max_turns: 4
      max_budget_usd: 0.10
      priority: low
